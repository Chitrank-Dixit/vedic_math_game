name: Android CI

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    name: Build & Test (Debug)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Run Android Lint (Debug)
        run: ./gradlew lintDebug --no-daemon

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  release:
    name: Build & Sign Release Bundle
    runs-on: ubuntu-latest
    needs: debug
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Release Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is not configured. Release signing requires valid credentials."
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          chmod 600 "$RUNNER_TEMP/release.keystore"

      - name: Run Android Lint (Release)
        run: ./gradlew lintRelease --no-daemon
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Build Release Bundle (AAB)
        run: ./gradlew bundleRelease --no-daemon
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Verify Release Artifact
        run: |
          AAB_PATH="app/build/outputs/bundle/release/app-release.aab"
          echo "===================================================="
          echo "Verifying Production Release Artifact (AAB)"
          echo "===================================================="

          # 1. Existence check
          if [ ! -f "$AAB_PATH" ]; then
            echo "::error::Release bundle does not exist at expected path: $AAB_PATH"
            exit 1
          fi

          # 2. Non-zero size check
          AAB_SIZE=$(wc -c < "$AAB_PATH" | tr -d ' ')
          if [ -z "$AAB_SIZE" ] || [ "$AAB_SIZE" -le 0 ]; then
            echo "::error::Release bundle is empty (size: ${AAB_SIZE} bytes)"
            exit 1
          fi
          echo "AAB Path: $AAB_PATH"
          echo "AAB Size: $AAB_SIZE bytes ($(( AAB_SIZE / 1024 / 1024 )) MB)"

          # 3. Zip archive integrity & essential bundle structure
          unzip -t "$AAB_PATH" > /dev/null || { echo "::error::AAB archive integrity verification failed"; exit 1; }
          unzip -l "$AAB_PATH" | grep "base/manifest/AndroidManifest.xml" > /dev/null || { echo "::error::AAB missing base AndroidManifest.xml"; exit 1; }
          unzip -l "$AAB_PATH" | grep "base/dex/classes.dex" > /dev/null || { echo "::error::AAB missing base classes.dex"; exit 1; }
          unzip -l "$AAB_PATH" | grep "base/resources.pb" > /dev/null || { echo "::error::AAB missing base resources.pb"; exit 1; }

          # 4. Release signing verification using jarsigner
          jarsigner -verify "$AAB_PATH" > /dev/null || { echo "::error::AAB signature verification failed"; exit 1; }
          echo "AAB Signing: VERIFIED"

          # 5. Metadata verification (applicationId, versionCode, versionName, targetSdk)
          BUNDLE_MANIFEST="app/build/intermediates/bundle_manifest/release/processApplicationManifestReleaseForBundle/AndroidManifest.xml"
          if [ -f "$BUNDLE_MANIFEST" ]; then
            APP_ID=$(grep -o 'package="[^"]*"' "$BUNDLE_MANIFEST" | head -1 | cut -d'"' -f2)
            VERSION_CODE=$(grep -o 'android:versionCode="[^"]*"' "$BUNDLE_MANIFEST" | head -1 | cut -d'"' -f2)
            VERSION_NAME=$(grep -o 'android:versionName="[^"]*"' "$BUNDLE_MANIFEST" | head -1 | cut -d'"' -f2)
            TARGET_SDK=$(grep -o 'android:targetSdkVersion="[^"]*"' "$BUNDLE_MANIFEST" | head -1 | cut -d'"' -f2)

            echo "Package / Application ID: $APP_ID"
            echo "Version Code:             $VERSION_CODE"
            echo "Version Name:             $VERSION_NAME"
            echo "Target SDK:               $TARGET_SDK"

            if [ "$APP_ID" != "com.ankh.sutrasaga" ]; then
              echo "::error::Application ID mismatch: got '$APP_ID', expected 'com.ankh.sutrasaga'"
              exit 1
            fi
            if [ "$VERSION_CODE" != "1" ]; then
              echo "::error::Version Code mismatch: got '$VERSION_CODE', expected '1'"
              exit 1
            fi
            if [ -z "$VERSION_NAME" ]; then
              echo "::error::Version Name is empty"
              exit 1
            fi
            if [ "$TARGET_SDK" != "36" ]; then
              echo "::error::Target SDK mismatch: got '$TARGET_SDK', expected '36'"
              exit 1
            fi
          else
            echo "::error::Bundle manifest not found at $BUNDLE_MANIFEST"
            exit 1
          fi

          echo "===================================================="
          echo "Release Artifact Verification: PASSED"
          echo "===================================================="

      - name: Secure Cleanup of Keystore
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/release.keystore" ]; then
            shred -u "$RUNNER_TEMP/release.keystore" 2>/dev/null || rm -f "$RUNNER_TEMP/release.keystore"
          fi

      - name: Upload Release Bundle (AAB)
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: sutrasaga-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload Release ProGuard Mapping
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: sutrasaga-release-mapping
          path: app/build/outputs/mapping/release/
          if-no-files-found: ignore

