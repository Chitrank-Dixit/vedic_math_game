<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="vedicBrandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E65100" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Squircle Canvas -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="#0F172A" stroke="url(#vedicBrandGrad)" stroke-width="4" stroke-opacity="0.5" />

  <!-- 8-Pointed Mandala Star -->
  <path d="M 256 92 L 285.9 194.1 L 372 140 L 317.9 226.1 L 420 256 L 317.9 285.9 L 372 372 L 285.9 317.9 L 256 420 L 226.1 317.9 L 140 372 L 194.1 285.9 L 92 256 L 194.1 226.1 L 140 140 L 226.1 194.1 Z"
        stroke="url(#vedicBrandGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Infinity Symbol Loop (∞) -->
  <path d="M 256 256 C 210 200, 130 200, 130 256 C 130 312, 210 312, 256 256 C 302 200, 382 200, 382 256 C 382 312, 302 312, 256 256 Z"
        stroke="url(#vedicBrandGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Central Sacred Bindu Point -->
  <circle cx="256" cy="256" r="12" fill="url(#vedicBrandGrad)" filter="url(#glow)" />
</svg>
